name: Test interactive beginner course
on:
  push:
    paths:
      - index.html
      - tests/course.spec.cjs
      - .github/workflows/interactive-course.yml
  pull_request:
    paths:
      - index.html
      - tests/course.spec.cjs
      - .github/workflows/interactive-course.yml
jobs:
  interactive-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test interactive course in a real browser
        run: node tests/course.spec.cjs
      - name: Save visual screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-course-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
