name: Test beginner websites
on:
  push:
    branches: [main]
    paths:
      - index.html
      - course.html
      - workflows.html
      - lessons/**
      - assets/**
      - tools/**
      - tests/**
      - README.md
      - .github/workflows/interactive-course.yml
  pull_request:
    paths:
      - index.html
      - course.html
      - workflows.html
      - lessons/**
      - assets/**
      - tools/**
      - tests/**
      - README.md
      - '0*/**'
      - .github/workflows/interactive-course.yml
jobs:
  interactive-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the guide page is up to date
        run: |
          node tools/build-guide.cjs
          git diff --exit-code -- index.html assets || (echo "::error::The guide (index.html) is out of date. Run 'node tools/build-guide.cjs' and commit the result." && exit 1)
      - name: Test the guide page
        if: always()
        run: node tests/site.spec.cjs
      - name: Test the Desktop simulator
        if: always()
        run: node tests/course.spec.cjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beginner-website-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
