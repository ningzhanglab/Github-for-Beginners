<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="593" viewBox="0 0 1200 593" role="img" aria-labelledby="t d"><title id="t">Local versus cloud agent and GitHub Desktop</title><desc id="d">Local agent edits show in GitHub Desktop while cloud agent PRs show in GitHub online, followed by human review</desc><rect x="1" y="1" width="1198" height="591" rx="22" fill="#F7FAFF" stroke="#CDD9E8" stroke-width="2"/><text x="47" y="64" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#18304B">AI AGENT COLLABORATION — WHERE DO THE FILES APPEAR?</text><text x="47" y="99" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#52657B">Example task: add variable definitions to synthetic county-year data</text><rect x="43" y="136" width="539" height="388" rx="19" fill="#EAF2FF" stroke="#AECBEF" stroke-width="2"/><rect x="613" y="136" width="541" height="388" rx="19" fill="#E7F6EE" stroke="#B1DFCC" stroke-width="2"/><text x="74" y="179" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#2C65C8">LOCAL AGENT</text><text x="646" y="179" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#148769">REMOTE / CLOUD AGENT</text><rect x="76" y="211" width="472" height="79" rx="11" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="101" y="244" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#18304B">Edits your cloned project folder</text><text x="101" y="271" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">(on your computer)</text><path d="M313,294 L313,329" fill="none" stroke="#2C65C8" stroke-width="3" stroke-linecap="round"/><path d="M305 321 L313 331 L321 321" fill="none" stroke="#2C65C8" stroke-width="3"/><rect x="76" y="346" width="472" height="90" rx="12" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="102" y="381" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#18304B">Desktop → Changes / History</text><text x="102" y="410" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">Review before committing or pushing</text><rect x="646" y="211" width="473" height="79" rx="11" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="672" y="244" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#18304B">Edits a branch on GitHub.com</text><text x="672" y="271" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">(not automatically on your laptop)</text><path d="M887,294 L887,329" fill="none" stroke="#148769" stroke-width="3" stroke-linecap="round"/><path d="M879 321 L887 331 L895 321" fill="none" stroke="#148769" stroke-width="3"/><rect x="646" y="346" width="473" height="90" rx="12" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="672" y="381" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#18304B">GitHub.com → Pull Requests</text><text x="672" y="410" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">Review, merge, then pull in Desktop</text><text x="74" y="490" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">Same folder and branch? Check first.</text><text x="646" y="490" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">PR and access available? Verify first.</text><text x="47" y="565" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#18304B">Never trust the agent's “done” message alone: verify the actual branch, files, and tests.</text></svg>