<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" role="img" aria-labelledby="t d"><title id="t">Economics example from issue to merge</title><desc id="d">Five steps of a real Issue and PR on a fictional economics project, followed by a Desktop fetch and pull</desc><rect x="1" y="1" width="1238" height="528" rx="22" fill="#F7FAFF" stroke="#CDD9E8" stroke-width="2"/><text x="50" y="62" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#18304B">A REAL GITHUB WORKFLOW, USING A TOY ECONOMICS PROJECT</text><text x="50" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#52657B">Issue #3 → separate branch → commit → PR #4 → merge → Desktop pull</text><rect x="45" y="149" width="217" height="236" rx="15" fill="#FFF4DD" stroke="#CDD9E8" stroke-width="2"/><circle cx="83" cy="178" r="22" fill="#A97412"/><text x="83" y="185" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text><text x="67" y="251" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#A97412">ISSUE</text><text x="67" y="298" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#18304B">#3: document variables</text><text x="67" y="352" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#52657B">Visible history</text><path d="M264,276 L281,276" fill="none" stroke="#90A5C2" stroke-width="3" stroke-linecap="round"/><path d="M271,269 L281,276 L271,283" fill="none" stroke="#90A5C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="149" width="217" height="236" rx="15" fill="#EAF2FF" stroke="#CDD9E8" stroke-width="2"/><circle cx="322" cy="178" r="22" fill="#2C65C8"/><text x="322" y="185" font-family="Arial, Helvetica, sans-seri