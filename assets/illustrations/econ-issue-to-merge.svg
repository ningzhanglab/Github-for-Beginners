width="2"/><circle cx="800" cy="178" r="22" fill="#A97412"/><text x="800" y="185" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text><text x="784" y="251" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#A97412">PR REVIEW</text><text x="784" y="298" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#18304B">#4: inspect changes</text><text x="784" y="352" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#52657B">Human checks diff</text><path d="M981,276 L998,276" fill="none" stroke="#90A5C2" stroke-width="3" stroke-linecap="round"/><path d="M988,269 L998,276 L988,283" fill="none" stroke="#90A5C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1001" y="149" width="217" height="236" rx="15" fill="#E7F6EE" stroke="#CDD9E8" stroke-width="2"/><circle cx="1039" cy="178" r="22" fill="#148769"/><text x="1039" y="185" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text><text x="1023" y="251" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#148769">MERGE</text><text x="1023" y="298" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#18304B">checked files in main</text><text x="1023" y="352" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#52657B">Approved version</text><rect x="130" y="412" width="970" height="53" rx="11" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="615" y="445" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#18304B">Desktop: choose main → Fetch origin → Pull origin (update local research folder)</text><text x="50" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#52657B">The GitHub Issue and PR are real; counties and economic data are fictional.</text></svg>