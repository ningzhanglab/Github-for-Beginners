<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="t d"><title id="t">Why GitHub matters in economics research</title><desc id="d">Comparison of confusing final-version filenames with a reviewable sequence of commits and a merged pull request</desc><rect x="1" y="1" width="1198" height="523" rx="22" fill="#F7FAFF" stroke="#CDD9E8" stroke-width="2"/><text x="50" y="62" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="start" fill="#18304B">WHY USE GITHUB FOR ECONOMICS RESEARCH?</text><text x="50" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#52657B">Example: a fictional county-level wages and unemployment research project</text><rect x="42" y="132" width="534" height="328" rx="17" fill="#FFF0F1" stroke="#F0CCD0" stroke-width="2"/><rect x="623" y="132" width="534" height="328" rx="17" fill="#E7F6EE" stroke="#AFE2CF" stroke-width="2"/><text x="77" y="173" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#C34F55">Without version history</text><text x="657" y="173" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#148769">With GitHub + Desktop</text><rect x="79" y="205" width="452" height="45" rx="8" fill="#FFFFFF" stroke="#E9CED1" stroke-width="1"/><text x="98" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#18304B">table_final.csv</text><rect x="79" y="263" width="452" height="45" rx="8" fill="#FFFFFF" stroke="#E9CED1" stroke-width="1"/><text x="98" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#18304B">table_final_new.csv</text><rect x="79" y="321" width="452" height="45" rx="8" fill="#FFFFFF" stroke="#E9CED1" stroke-width="1"/><text x="98" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#18304B">table_final_REVISED2.csv</text><text x="78" y="426" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#C34F55">Which table is correct? Who changed it?</text><path d="M700,228 L700,371" fill="none" stroke="#95AEC8" stroke-width="4" stroke-linecap="round"/><circle cx="700" cy="226" r="10" fill="#2C65C8"/><rect x="729" y="203" width="372" height="47" rx="10" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="751" y="233" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#18304B">Commit 1   Synthetic dataset</text><circle cx="700" cy="294" r="10" fill="#2C65C8"/><rect x="729" y="271" width="372" height="47" rx="10" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="751" y="301" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#18304B">Commit 2   Document variables</text><circle cx="700" cy="362" r="10" fill="#148769"/><rect x="729" y="339" width="372" height="47" rx="10" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="1"/><text x="751" y="369" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#18304B">PR #4        Reviewed and merged</text><text x="659" y="427" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#148769">History explains which version was approved</text><text x="45" y="502" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#52657B">Educational diagram • The dataset is synthetic, and this is not an empirical research result.</text></svg>